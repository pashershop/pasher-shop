name = "pasher-shop"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# Cloudflare D1 SQL Database Binding
# Name: DB, Value: pasher-shop-db
[[d1_databases]]
binding = "DB"
database_name = "pasher-shop-db"
database_id = "pasher-shop-db"
